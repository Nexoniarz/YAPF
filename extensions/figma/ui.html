<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 12px Inter, system-ui, sans-serif; margin: 0; padding: 14px;
         color: var(--figma-color-text, #333); background: var(--figma-color-bg, #fff); }
  h2 { font-size: 13px; margin: 0 0 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; }
  button { font: inherit; padding: 7px 10px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--figma-color-border, #ccc);
           background: var(--figma-color-bg-secondary, #f5f5f5); color: inherit; }
  button.primary, .tabs button.on { background: var(--figma-color-bg-brand, #0d99ff);
           color: var(--figma-color-text-onbrand, #fff); border-color: transparent; }
  #drop { border: 2px dashed var(--figma-color-border, #ccc); border-radius: 8px; padding: 28px 10px;
          text-align: center; cursor: pointer; color: var(--figma-color-text-secondary, #777); }
  #drop.hover { border-color: var(--figma-color-border-brand, #0d99ff); }
  #status { margin-top: 10px; min-height: 32px; color: var(--figma-color-text-secondary, #777);
            white-space: pre-line; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  select { font: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tabs">
  <button id="tab-import">Import</button>
  <button id="tab-export">Export</button>
</div>

<section id="import">
  <h2>Import YAPF images</h2>
  <div id="drop">Drop .yapf files here<br>or click to choose</div>
  <input id="file" type="file" accept=".yapf" multiple hidden>
</section>

<section id="export" hidden>
  <h2>Export selection as YAPF</h2>
  <div id="sel">Nothing selected</div>
  <div class="row">Scale
    <select id="scale"><option>1</option><option>2</option><option>4</option></select>
  </div>
  <button id="go" class="primary">Export</button>
</section>

<div id="status"></div>

<script>/*
 * yapf.js — YAPF encoder (v1) and decoder (v1 and v2) in plain JavaScript.
 *
 * Copyright 2026 Nexoniarz — Apache License 2.0.
 *
 * Works in browsers, Node.js, Figma plugins and VS Code webviews; no
 * dependencies.  Produces exactly the same bytes as the C library.
 *
 *   const img  = YAPF.decode(bytes);    // Uint8Array → image
 *   const file = YAPF.encode(img);      // image → Uint8Array
 *   const rgba = YAPF.toRGBA(img);      // any channel count → RGBA pixels
 *
 *   const tex  = YAPF.decodeTexture(bytes);          // any v1 / v2 file
 *   const view = YAPF.textureToRGBA(tex, surface);   // { width, height, rgba }
 *
 * An image is { width, height, channels (1–4), pixels: Uint8Array,
 *               gpuFormat, flags, mipLevels, mips: [Uint8Array, …] }.
 * Version 2 textures (GPU blocks, 16-bit / float, cubes, arrays, volumes,
 * animation) are decoded by decodeTexture; encoding writes version 1.
 * The specification: yapf.h (v1) and docs/FORMAT.md (v2).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.YAPF = factory();
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const TILE = 64, TILE_PX = TILE * TILE, GROUP = 8, BAND = 8, RING = 16;
  const MAX_GROUPS = TILE_PX / GROUP, MAX_DIM = 65535, MAX_MIPS = 16;
  const STORED = 0x80, SUBGREEN = 0x10, NIB_REPEAT = 9;
  const F_LEFT = 0, F_GRAD = 1, F_UPRIGHT = 2, F_UPAVG = 3, F_UP = 16;
  const NIB_GROUPS = [1, 1, 1, 1, 1, 1, 1, 1, 1, 2, 3, 4, 8, 16, 32, 64];
  const RUN_LENS = [2, 3, 4, 8, 16, 32, 64];
  /* Encoder try order: cheapest to decode first, ties go to the earlier. */
  const FILTERS = [F_UP, F_UP + 1, F_UP + 2, F_UP + 3, F_UP + 4, F_UP + 5,
                   F_UP + 6, F_UP + 7, F_UPRIGHT, F_UPAVG, F_LEFT, F_GRAD];

  const GPU = { RGBA8: 0, RGB8: 1, RG8: 2, R8: 3, SRGB8_A8: 4, SRGB8: 5 };
  const FLAG = { PREMULT_ALPHA: 1, SRGB: 2 };

  const ZERO_ROW = new Uint8Array(TILE + 1);

  const zz   = (r) => ((r << 1) ^ ((r << 24) >> 31)) & 255;  /* r is 0..255 */
  const unzz = (z) => ((z >>> 1) ^ -(z & 1)) & 255;
  const width = (z) => (z === 0 ? 0 : 32 - Math.clz32(z));
  const s8 = (v) => (v << 24) >> 24;
  const filterValid = (f) => f <= F_UPAVG || (f >= F_UP && f < F_UP + 8);
  const upK = (f) => (f >= F_UP ? f - F_UP + 1 : 1);

  function corrupt() { throw new YapfError('corrupt', 'corrupt file'); }

  /* ── Version 2: textures (decoding) ───────────────────────────────── */

  const ENTROPY = 0x20, NOXFORM = 0x40, BLOCK_TILE = 16;
  const HUFF_BITS = 11, HUFF_SIZE = 1 << HUFF_BITS, SLOTS = 48, CTXS = 7;
  const NEED = { WIDE: 1, BLOCKS: 2, ENTROPY: 4, LAYOUT: 8, FRAMES: 16, ALL: 31 };
  const r16 = (b, p) => b[p] | (b[p + 1] << 8);
  const r64 = (b, p) => r32(b, p) + r32(b, p + 4) * 4294967296;

  class YapfError extends Error {
    constructor(code, msg) { super('YAPF: ' + msg); this.code = code; }
  }
  const fail = (code, msg) => { throw new YapfError(code, msg); };
  const bad = () => fail('corrupt', 'corrupt file');

  /* yapf-sum: 64-bit lanes kept as [hi, lo] uint32 pairs. */
  const KH = 0x9E3779B9, KL = 0x7F4A7C15;
  function mul64(ah, al, bh, bl) {            /* (a · b) mod 2^64 */
    const a0 = al & 0xFFFF, a1 = al >>> 16, b0 = bl & 0xFFFF, b1 = bl >>> 16;
    const p00 = a0 * b0, p01 = a0 * b1, p10 = a1 * b0, p11 = a1 * b1;
    const mid = (p00 >>> 16) + (p01 & 0xFFFF) + (p10 & 0xFFFF);
    const lo = ((mid & 0xFFFF) * 65536 + (p00 & 0xFFFF)) >>> 0;
    const hi = (p11 + (p01 >>> 16) + (p10 >>> 16) + Math.floor(mid / 65536) +
                Math.imul(ah, bl) + Math.imul(al, bh)) >>> 0;
    return [hi, lo];
  }
  function checksum(b, p, n) {
    const lanes = [];
    for (let i = 0; i < 4; i++) {
      const [h, l] = mul64(0, i + 1, KH, KL);
      lanes.push([(h ^ Math.floor(n / 4294967296)) >>> 0, (l ^ (n >>> 0)) >>> 0]);
    }
    const words = Math.ceil(n / 8);
    for (let j = 0; j < words; j++) {
      const q = p + j * 8;
      let wl, wh;
      if (q + 8 <= p + n) { wl = r32(b, q); wh = r32(b, q + 4); }
      else {
        const t = new Uint8Array(8); t.set(b.subarray(q, p + n));
        wl = r32(t, 0); wh = r32(t, 4);
      }
      const a = lanes[j & 3];
      const [h, l] = mul64((a[0] ^ wh) >>> 0, (a[1] ^ wl) >>> 0, KH, KL);
      a[0] = h; a[1] = (l ^ h) >>> 0;                    /* a ^= a >> 32 */
    }
    const rot = (x, r) => r === 32 ? [x[1], x[0]]
      : [((x[0] << r) | (x[1] >>> (32 - r))) >>> 0, ((x[1] << r) | (x[0] >>> (32 - r))) >>> 0];
    const r1 = rot(lanes[1], 16), r2 = rot(lanes[2], 32), r3 = rot(lanes[3], 48 - 32);
    const r3b = [r3[1], r3[0]];                            /* rotl 48 = rotl 16 then swap */
    let hh = (lanes[0][0] ^ r1[0] ^ r2[0] ^ r3b[0]) >>> 0, hl = (lanes[0][1] ^ r1[1] ^ r2[1] ^ r3b[1]) >>> 0;
    [hh, hl] = mul64(hh, hl, KH, KL);
    return (hl ^ hh) >>> 0;
  }

  /* Huffman code table → lut[off .. off + 2048) (length << 8 | symbol). */
  function huffTable(b, p, end, lut, off) {
    if (p >= end) bad();
    const n = b[p++] + 1, nbytes = (n + 1) >> 1;
    if (end - p < nbytes) bad();
    const len = new Uint8Array(n), count = new Uint32Array(HUFF_BITS + 2);
    let kraft = 0;
    for (let i = 0; i < n; i++) {
      const l = (b[p + (i >> 1)] >> ((i & 1) * 4)) & 15;
      if (l > HUFF_BITS) bad();
      len[i] = l; count[l]++;
      if (l) kraft += HUFF_SIZE >> l;
    }
    if ((n & 1) && (b[p + (n >> 1)] >> 4)) bad();
    if (kraft === 0 || kraft > HUFF_SIZE) bad();
    p += nbytes;
    const next = new Uint32Array(HUFF_BITS + 2);
    let code = 0;
    count[0] = 0;
    for (let l = 1; l <= HUFF_BITS; l++) { code = (code + count[l - 1]) << 1; next[l] = code; }
    for (let s = 0; s < n; s++) {
      const l = len[s];
      if (!l) continue;
      let c = next[l]++, r = 0;
      for (let i = 0; i < l; i++) { r = (r << 1) | (c & 1); c >>= 1; }
      for (let k = r; k < HUFF_SIZE; k += 1 << l) lut[off + k] = (l << 8) | s;
    }
    return p;
  }

  /* Code book → per slot one Uint16Array of 7 × 2048 entries. */
  function readBook(b, p, len) {
    const end = p + len;
    if (len < 2) bad();
    const n = r16(b, p);
    p += 2;
    if (n === 0 || n > SLOTS * CTXS) bad();
    const book = new Array(SLOTS).fill(null), seen = new Uint8Array(SLOTS * CTXS);
    for (let i = 0; i < n; i++) {
      if (end - p < 3) bad();
      const slot = b[p], ctx = b[p + 1];
      if (slot >= SLOTS || ctx >= CTXS || seen[slot * CTXS + ctx]) bad();
      seen[slot * CTXS + ctx] = 1;
      if (!book[slot]) book[slot] = new Uint16Array(CTXS * HUFF_SIZE);
      p = huffTable(b, p + 2, end, book[slot], ctx * HUFF_SIZE);
    }
    if (p !== end) bad();
    return book;
  }

  /* Context of a residual from the folded residuals left + above. */
  const ctxOf = (s) => (s > 0) + (s > 2) + (s > 6) + (s > 14) + (s > 30) + (s > 62);

  /* Entropy plane payload: filters, u16 length, context-coded residuals. */
  function huffPlane(b, p, end, z, tw, th, book, slot) {
    const nb = (th + BAND - 1) >> 3;
    if (!book || !book[slot] || end - p < nb + 2) bad();
    const filt = b.subarray(p, p + nb);
    for (let i = 0; i < nb; i++) if (!filterValid(filt[i])) bad();
    p += nb;
    const L = r16(b, p);
    p += 2;
    if (end - p < L) bad();
    const lut = book[slot], se = p + L;
    let buf = 0, bits = 0, pos = p, used = 0, i = 0;
    for (let y = 0; y < th; y++)
      for (let x = 0; x < tw; x++, i++) {
        while (bits <= 24) { buf |= (pos < se ? b[pos] : 0) << bits; pos++; bits += 8; }
        const s = (x ? z[i - 1] : 0) + (y ? z[i - tw] : 0);
        const e = lut[(ctxOf(s) << HUFF_BITS) | (buf & (HUFF_SIZE - 1))];
        if (!e) bad();
        const n = e >> 8;
        buf >>>= n; bits -= n; used += n;
        z[i] = e & 255;
      }
    if (Math.ceil(used / 8) !== L) bad();
    z.fill(0, tw * th, tw * th + GROUP);
    return { p: se, filt };
  }

  /* Wide samples: byte planes, transforms at the sample width. */
  function decodeTileWide(b, p, end, out, imgW, tx, ty, tw, th, ch, sample, book) {
    const sb = sample === 3 ? 4 : 2, bits = 8 * sb, isf = sample >= 2, np = ch * sb;
    const half = bits === 32 ? 0x80000000 : 0x8000;
    const mod = bits === 32 ? (x) => x >>> 0 : (x) => x & 0xFFFF;
    const sar1 = (v) => mod((v >>> 1) | (v & half));
    if (end <= p) bad();
    const hdr = b[p++];
    if (hdr === STORED) {
      if (end - p !== tw * th * ch * sb) bad();
      for (let y = 0; y < th; y++) {
        const d = ((ty + y) * imgW + tx) * ch;
        for (let i = 0; i < tw * ch; i++, p += sb)
          out[d + i] = sb === 2 ? r16(b, p) : r32(b, p);
      }
      return;
    }
    if (hdr & 0x8F) bad();
    if ((hdr & NOXFORM) && (hdr & SUBGREEN)) bad();
    if (ch < 3 && (hdr & (NOXFORM | SUBGREEN))) bad();
    const xf = ch < 3 ? 2 : (hdr & NOXFORM) ? 2 : (hdr & SUBGREEN) ? 1 : 0;
    const tsel = ch < 3 ? 0 : xf;
    if (end - p < 2) bad();
    const cmask = r16(b, p);
    p += 2;
    if (cmask >> np) bad();
    let emask = 0;
    if (hdr & ENTROPY) {
      if (end - p < 2 || !book) bad();
      emask = r16(b, p);
      p += 2;
      if ((emask >> np) || (emask & cmask)) bad();
    }
    const RL = TILE + 1, PL = TILE * RL;
    const planes = new Uint8Array(np * PL), z = new Uint8Array(TILE_PX + GROUP);
    for (let pl = 0; pl < np; pl++) {
      if (!(cmask & (1 << pl))) continue;
      if (p >= end) bad();
      planes.fill(b[p++], pl * PL, (pl + 1) * PL);
    }
    for (let pl = 0; pl < np; pl++) {
      if (cmask & (1 << pl)) continue;
      z.fill(0);
      const r = (emask & (1 << pl)) ? huffPlane(b, p, end, z, tw, th, book, tsel * 16 + pl)
                                    : unpackPlane(b, p, end, z, tw, th);
      p = r.p;
      const base = pl * PL;
      for (let y = 0; y < th; y++) {
        const f = r.filt[y >> 3], k = upK(f);
        unfilterRow(f, planes, base + y * RL,
                    y ? planes : ZERO_ROW, y ? base + (y - 1) * RL : 0,
                    y >= k ? planes : ZERO_ROW, y >= k ? base + (y - k) * RL : 0,
                    z, y * tw, tw);
      }
    }
    if (p !== end) bad();
    const v = [0, 0, 0, 0];
    for (let y = 0; y < th; y++) {
      const d0 = ((ty + y) * imgW + tx) * ch, r0 = y * RL;
      for (let x = 0; x < tw; x++) {
        for (let c = 0; c < ch; c++) {
          let a = 0;
          for (let k = 0; k < sb; k++) a = a * 256 + planes[(c * sb + k) * PL + r0 + x];
          v[c] = a;
        }
        if (xf === 0) {
          const o = mod(v[1] - half), q = mod(v[2] - half), t = mod(v[0] - sar1(q));
          const g = mod(q + t), bb = mod(t - sar1(o));
          v[0] = mod(bb + o); v[1] = g; v[2] = bb;
        } else if (xf === 1) {
          const g = v[0];
          v[0] = mod(v[1] + g - half); v[2] = mod(v[2] + g - half); v[1] = g;
        }
        for (let c = 0; c < ch; c++) {
          let s = v[c];
          if (isf) s = (s & half) ? mod(s ^ half) : mod(~s);
          out[d0 + x * ch + c] = s;
        }
      }
    }
  }

  /* GPU block tile: raw, or packed lane by lane with the book. */
  function decodeBlockTile(b, p, end, packed, out, o0, rowb, tbw, tbh, S, book) {
    const n = tbw * tbh;
    if (!packed) {
      if (end - p !== n * S) bad();
      for (let r = 0; r < tbh; r++) out.set(b.subarray(p + r * tbw * S, p + (r + 1) * tbw * S), o0 + r * rowb);
      return;
    }
    if (!book) bad();
    let buf = 0, bits = 0, pos = p, used = 0;
    for (let k = 0; k < S; k++) {
      const lut = book[k];
      if (!lut) bad();
      for (let i = 0; i < n; i++) {
        while (bits <= 24) { buf |= (pos < end ? b[pos] : 0) << bits; pos++; bits += 8; }
        const e = lut[buf & (HUFF_SIZE - 1)];
        if (!e) bad();
        const l = e >> 8;
        buf >>>= l; bits -= l; used += l;
        out[o0 + Math.floor(i / tbw) * rowb + (i % tbw) * S + k] = e & 255;
      }
    }
    if (Math.ceil(used / 8) !== end - p) bad();
  }

  const BLOCK_FORMATS = {
    0x40: [4, 4, 8], 0x41: [4, 4, 16], 0x42: [4, 4, 16], 0x43: [4, 4, 8], 0x44: [4, 4, 8],
    0x45: [4, 4, 16], 0x46: [4, 4, 16], 0x47: [4, 4, 16], 0x48: [4, 4, 16], 0x49: [4, 4, 16],
    0x50: [4, 4, 8], 0x51: [4, 4, 8], 0x52: [4, 4, 16], 0x53: [4, 4, 8], 0x54: [4, 4, 8],
    0x55: [4, 4, 16], 0x56: [4, 4, 16]
  };
  [[4, 4], [5, 4], [5, 5], [6, 5], [6, 6], [8, 5], [8, 6], [8, 8], [10, 5], [10, 6], [10, 8],
   [10, 10], [12, 10], [12, 12]].forEach(([w, h], i) => { BLOCK_FORMATS[0x60 + i] = [w, h, 16]; });

  function mipSize(t, m) {
    return [Math.max(1, t.width >>> m), Math.max(1, t.height >>> m),
            t.shape === 2 ? Math.max(1, t.depth >>> m) : 1];
  }

  function surfaceBytes(t, m) {
    const [w, h, d] = mipSize(t, m);
    if (t.payload === 1) {
      const [bw, bh, S] = BLOCK_FORMATS[t.format];
      return Math.ceil(w / bw) * Math.ceil(h / bh) * d * S;
    }
    return w * h * d * t.channels * (t.sample === 0 ? 1 : t.sample === 3 ? 4 : 2);
  }

  /* Decodes one surface (v2) into a typed array. */
  function decodeSurface(b, t, s, verify) {
    const m = s % t.mipLevels, [w, h, d] = mipSize(t, m);
    const off = t._off[s], size = t._size[s], blocks = t.payload === 1;
    let tcx, tcy, nbx = 0, nby = 0, S = 0;
    if (blocks) {
      const f = BLOCK_FORMATS[t.format];
      nbx = Math.ceil(w / f[0]); nby = Math.ceil(h / f[1]); S = f[2];
      tcx = Math.ceil(nbx / BLOCK_TILE); tcy = Math.ceil(nby / BLOCK_TILE);
    } else {
      tcx = Math.ceil(w / TILE); tcy = Math.ceil(h / TILE);
    }
    const tiles = tcx * tcy * d;
    if (size < 4) bad();
    const bl = r32(b, off);
    if (bl > size - 4 || Math.floor((size - 4 - bl) / 8) < tiles) bad();
    const pre = 4 + bl;
    if (verify && checksum(b, off, pre + tiles * 8) !== t._tcheck[s]) fail('checksum', 'damaged file: a checksum does not match');
    let book = null;
    if (bl) {
      if (!(t.needs & NEED.ENTROPY)) bad();
      book = readBook(b, off + 4, bl);
    }
    const table = off + pre, end = off + size;
    let pos = table + tiles * 8;
    const sizes = new Array(tiles), packed = new Array(tiles), starts = new Array(tiles);
    for (let i = 0; i < tiles; i++) {
      let sz = r32(b, table + i * 8);
      packed[i] = sz >>> 31;
      sz &= 0x7FFFFFFF;
      if (packed[i] && (!blocks || !book)) bad();
      if (sz > end - pos) bad();
      starts[i] = pos; sizes[i] = sz; pos += sz;
    }
    if (pos !== end) bad();

    const bytes = surfaceBytes(t, m);
    let out, store;
    if (blocks || t.sample === 0) out = store = new Uint8Array(bytes);
    else if (t.sample === 3) { store = new Uint32Array(bytes / 4); out = new Float32Array(store.buffer); }
    else out = store = new Uint16Array(bytes / 2);
    for (let i = 0; i < tiles; i++) {
      const p = starts[i], e = p + sizes[i];
      if (verify && checksum(b, p, sizes[i]) !== r32(b, table + i * 8 + 4))
        fail('checksum', 'damaged file: a checksum does not match');
      const row = Math.floor(i / tcx), z = Math.floor(row / tcy), ty = row % tcy, tx = i % tcx;
      if (blocks) {
        const bx0 = tx * BLOCK_TILE, by0 = ty * BLOCK_TILE, rowb = nbx * S;
        decodeBlockTile(b, p, e, packed[i], store, z * nby * rowb + by0 * rowb + bx0 * S, rowb,
                        Math.min(BLOCK_TILE, nbx - bx0), Math.min(BLOCK_TILE, nby - by0), S, book);
      } else {
        const x0 = tx * TILE, y0 = ty * TILE, tw = Math.min(TILE, w - x0), th = Math.min(TILE, h - y0);
        const slice = w * h * t.channels;
        const view = store.subarray(z * slice, (z + 1) * slice);
        if (t.sample === 0) decodeTile(b, p, e, view, w, x0, y0, tw, th, t.channels, true, book);
        else decodeTileWide(b, p, e, view, w, x0, y0, tw, th, t.channels, t.sample, book);
      }
    }
    return out;
  }

  /*
   * decodeTexture(bytes, { verify = true }) — any YAPF file (v1 or v2).
   * Returns { version, width, height, depth, layers, frames, faces, shape,
   * mipLevels, payload, format, sample, channels, flags, channelMap,
   * linearMask, normal, primaries, transfer, mipFilter, alphaRef,
   * loopCount, frameUs, notes: [{ tag, data }], surfaces: [...] }, where
   * surfaces[s] is a Uint8Array (8-bit pixels, GPU blocks), Uint16Array
   * (16-bit, half bits) or Float32Array, numbered
   * s = ((frame · layers + layer) · faces + face) · mipLevels + mip.
   * Errors are YapfError with .code 'not-yapf', 'version', 'unsupported',
   * 'corrupt', 'checksum' or 'truncated'.
   */
  function decodeTexture(input, opts) {
    const b = input instanceof Uint8Array ? input : new Uint8Array(input);
    const verify = !(opts && opts.verify === false);
    if (b.length < 5 || b[0] !== 0x59 || b[1] !== 0x41 || b[2] !== 0x50 || b[3] !== 0x46)
      fail('not-yapf', 'not a YAPF file');
    if (b[4] === 1) {
      const img = decodeV1(b);
      return { version: 1, width: img.width, height: img.height, depth: 1, layers: 1, frames: 1,
               faces: 1, shape: 0, mipLevels: img.mipLevels, payload: 0, format: img.gpuFormat,
               sample: 0, channels: img.channels, flags: img.flags, channelMap: [0, 0, 0, 0],
               linearMask: 0, normal: 0, primaries: 0, transfer: 0, mipFilter: 0, alphaRef: 0,
               loopCount: 0, frameUs: [], notes: [], surfaces: img.mips };
    }

            for (let i = 0; i < 16; i++) px[i * 4 + 3] = ((blocks[o + (i >> 1)] >> (4 * (i & 1))) & 15) * 17;
            break;
          case 0x42: bc1Block(blocks, o + 8, px, true); bc4Block(blocks, o, px, 3, false); break;
          case 0x43: case 0x44:

            for (let i = 0; i < 16; i++) px[i * 4 + 3] = 255;
            break;
          case 0x45: case 0x46:
            px.fill(0); bc4Block(blocks, o, px, 0, format === 0x46); bc4Block(blocks, o + 8, px, 1, format === 0x46);
            for (let i = 0; i < 16; i++) px[i * 4 + 3] = 255;

          for (let x = 0; x < 4 && bx * 4 + x < w; x++) {

            if (hdr) for (let c = 0; c < 3; c++) out[d * 3 + c] = hx[i * 3 + c];

  function halfToFloat(h) {
    const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 31, m = h & 0x3FF;

   * ETC2 / EAC / ASTC.

    const data = tex.surfaces[surface], rgba = new Uint8ClampedArray(n * 4);
    let src, ch = tex.channels, kind = tex.payload === 1 ? 'u8' : ['u8', 'u16', 'f16', 'f32'][tex.sample];
    if (tex.payload === 1) {
      const per = data.length / d, blk = decodeBlocks(tex.format, data.subarray(per * slice, per * (slice + 1)), w, h);
      if (!blk) fail('unsupported', 'ETC2 / EAC / ASTC blocks cannot be shown');

  /* ── Decoder ──────────────────────────────────────────────────────── */

  function unpackPlane(b, p, end, z, tw, th) {
    const total = tw * th, ng = (total + GROUP - 1) >> 3, nb = (th + BAND - 1) >> 3;
    if (end - p < nb) corrupt();

    for (let i = 0; i < nb; i++) if (!filterValid(filt[i])) corrupt();

    const gw = new Uint8Array(ng + 64);

    if (g !== ng) corrupt();
    if (hi) { if (b[p] >> 4) corrupt(); p++; }
    if (end - p < data) corrupt();

    for (g = 0; g < ng; g++) {
      w = gw[g];
      const o = g * GROUP, mask = (1 << w) - 1;
      let acc = 0, bits = 0;
      for (let i = 0; i < GROUP; i++) {

  function unfilterRow(f, R, r0, U, u0, K, k0, Z, z0, tw) {
    if (f === F_LEFT) {
      let L = 0;
      for (let x = 0; x < tw; x++) R[r0 + x] = L = (L + unzz(Z[z0 + x])) & 255;
    } else if (f === F_GRAD) {
      let L = (U[u0] + unzz(Z[z0])) & 255;

      for (let x = 1; x < tw; x++)
        R[r0 + x] = L = (L + U[u0 + x] - U[u0 + x - 1] + unzz(Z[z0 + x])) & 255;
    } else {
      /* pred = (a + b) >> 1: Up k a = b = K;  Up-right a = b = U + 1;
       * Up-average a = U, b = U + 1.  Rows carry one extra sample. */
      let A, a0, B, b0;
      if (f >= F_UP) { A = K; a0 = k0; B = K; b0 = k0; }
      else if (f === F_UPAVG) { A = U; a0 = u0; B = U; b0 = u0 + 1; }
      else { A = U; a0 = u0 + 1; B = U; b0 = u0 + 1; }
      for (let x = 0; x < tw; x++)
        R[r0 + x] = (((A[a0 + x] + B[b0 + x]) >> 1) + unzz(Z[z0 + x])) & 255;

  function decodeTile(b, p, end, out, imgW, tx, ty, tw, th, ch, v2, book) {
    if (end <= p) corrupt();
    let hdr = b[p++];
    if (hdr === STORED) {
      const rowb = tw * ch;
      if (end - p !== rowb * th) corrupt();
      for (let y = 0; y < th; y++)
        out.set(b.subarray(p + rowb * y, p + rowb * (y + 1)), ((ty + y) * imgW + tx) * ch);
      return;
    }
    if (hdr & (v2 ? 0x80 : 0xE0)) corrupt();           /* reserved bits set */
    if ((hdr & 0x40) && (hdr & SUBGREEN)) corrupt();
    /* xf: 0 YCoCg-R, 1 subtract-green, 2 none (v2) */
    const xf = (hdr & 0x40) ? 2 : (hdr & SUBGREEN) ? 1 : 0, ent = hdr & 0x20;
    hdr &= 0x0F;
    if ((hdr >> ch) || (xf && ch < 3)) corrupt();

    if (ent) {                                         /* v2: entropy planes */
      if (p >= end || !book) corrupt();
      emask = b[p++];
      if ((emask >> ch) || (emask & hdr)) corrupt();
    }

    const rowLen = TILE + 1, planeLen = RING * rowLen;
    const rows = new Uint8Array(4 * planeLen);

    for (let c = 0; c < ch; c++) {

    for (let c = 0; c < ch; c++) {
      if (hdr & (1 << c)) continue;

      const r = (emask & (1 << c)) ? huffPlane(b, p, end, z[c], tw, th, book, xf * 16 + c)

    if (p !== end) corrupt();

    for (let y = 0; y < th; y++) {
      const ri = (y % RING) * rowLen;

                    y >= k ? rows : ZERO_ROW, y >= k ? base + ((y - k) % RING) * rowLen : 0,

      for (let x = 0; x < tw; x++, d += ch) {

            out[d + 2] = rows[P2 + x];
          } else if (xf) {

            out[d] = rows[P1 + x] + g - 128;
            out[d + 1] = g;
            out[d + 2] = rows[P2 + x] + g - 128;

            out[d + 1] = cg + t;
            out[d + 2] = bb;
          }
          if (ch === 4) out[d + 3] = rows[P3 + x];
        } else {
          out[d] = rows[P0 + x];
          if (ch === 2) out[d + 1] = rows[P1 + x];
        }

    }
  }

  const r32 = (b, p) => (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24)) >>> 0;

  function decode(input) {

        throw new YapfError('unsupported', 'this is a YAPF 2 texture (GPU blocks, 16-bit / float or a ' +

  function decodeV1(b) {
    if (b.length < 20 || b[0] !== 0x59 || b[1] !== 0x41 || b[2] !== 0x50 || b[3] !== 0x46)

    if (b.length < idxEnd) corrupt();

    const mips = [];

      if (off < idxEnd || off > b.length || len > b.length - off) corrupt();

  /* ── Encoder ──────────────────────────────────────────────────────── */

  class Out {
    constructor(n) { this.buf = new Uint8Array(Math.max(n, 1024)); this.len = 0; }
    reserve(n) {

  function predictRow(f, P, r0, u0, k0, pred, tw, U, K) {
    switch (f) {
      case F_LEFT: pred[0] = 0; for (let x = 1; x < tw; x++) pred[x] = P[r0 + x - 1]; break;
      case F_GRAD:
        pred[0] = U[u0];
        for (let x = 1; x < tw; x++) pred[x] = (P[r0 + x - 1] + U[u0 + x] - U[u0 + x - 1]) & 255;
        break;
      case F_UPRIGHT:
        for (let x = 0; x + 1 < tw; x++) pred[x] = U[u0 + x + 1];

      case F_UPAVG:
        for (let x = 0; x + 1 < tw; x++) pred[x] = (U[u0 + x] + U[u0 + x + 1]) >> 1;

  /* Picks a filter per band; fills z and filt; returns estimated cost. */

    const total = tw * th, nb = (th + BAND - 1) >> 3;
    const tmp = new Uint8Array(BAND * TILE + GROUP), pred = new Uint8Array(TILE);
    let sum = 0, prevFi = 0;
    for (let b = 0; b < nb; b++) {

      let bestCost = Infinity, bestFi = 0;
      for (let t = 0; t < FILTERS.length; t++) {

        const f = FILTERS[fi], k = upK(f), serial = f === F_LEFT || f === F_GRAD;
        let cost = 0, done = 0, lost = false;

          for (let x = 0; x < tw; x++) tmp[T + x] = zz((P[r0 + x] - pred[x]) & 255);
          const last = y + 1 === y1, end = last ? n : (y + 1 - y0) * tw;

        if (serial) cost += Math.floor(cost / 25);

  function emitPlane(o, z, filt, tw, th) {
    const total = tw * th, ng = (total + GROUP - 1) >> 3, nb = (th + BAND - 1) >> 3;
    o.reserve(nb + ng + ng * 8);
    for (let i = 0; i < nb; i++) o.buf[o.len++] = filt[i];

    const need = new Uint8Array(ng);
    for (let g = 0; g < ng; g++) {
      let m = 0;
      for (let i = 0; i < GROUP; i++) m |= z[g * GROUP + i];

    /* span[j][g] = widest need in [g, g + 2^j) */
    const span = [need.slice()];

      let nl = 0;
      for (; nl < 7 && g + RUN_LENS[nl] <= ng; nl++) {

        mx[nl] = L === 3 ? Math.max(span[1][g], need[g + 2]) : span[31 - Math.clz32(L)][g];
      }
      for (let pw = 0; pw <= 8; pw++) {
        let bc = lc, bk = lk;
        for (let li = 0; li < nl && mx[li] <= pw; li++) {
          const L = RUN_LENS[li], c = 1 + 2 * pw * L + cost[(g + L) * 9 + pw];
          if (c < bc) { bc = c; bk = NIB_REPEAT + li; }

    const gw = new Uint8Array(ng), nib = [];
    let pw = 0;
    for (let g = 0; g < ng;) {

      nib.push(k);
      if (k < NIB_REPEAT) { pw = k; gw[g++] = k; }
      else for (let n = 0; n < NIB_GROUPS[k]; n++) gw[g++] = pw;

    for (let k = 0; k < nib.length; k += 2)
      o.buf[o.len++] = nib[k] | (k + 1 < nib.length ? nib[k + 1] << 4 : 0);

    for (let g = 0; g < ng; g++) {
      const w = gw[g];
      let acc = 0, bits = 0;
      for (let i = 0; i < GROUP; i++) {
        acc |= z[g * GROUP + i] << bits; bits += w;
        while (bits >= 8) { o.buf[o.len++] = acc & 255; acc >>>= 8; bits -= 8; }
      }
    }
  }

  function encodeTile(o, sc, px, imgW, tx, ty, tw, th, ch) {
    const total = tw * th, start = o.len, raw = total * ch, tries = ch >= 3 ? 2 : 1;
    const mask = [0, 0], est = [0, 0];
    for (let t = 0; t < tries; t++) {
      const plane = sc.plane[t];
      for (let y = 0; y < th; y++) {
        let s = ((ty + y) * imgW + tx) * ch;
        for (let x = 0; x < tw; x++, s += ch) {
          const i = y * tw + x;
          if (ch < 3) { for (let c = 0; c < ch; c++) plane[c][i] = px[s + c]; continue; }
          const r = px[s], g = px[s + 1], b = px[s + 2];
          if (t === 0) {
            const oo = (r - b) & 255, tt = (b + (s8(oo) >> 1)) & 255, q = (g - tt) & 255;
            plane[0][i] = (tt + (s8(q) >> 1)) & 255;
            plane[1][i] = (oo + 128) & 255;
            plane[2][i] = (q + 128) & 255;
          } else {

            plane[1][i] = (r - g + 128) & 255;
            plane[2][i] = (b - g + 128) & 255;

        const P = plane[c];
        let i = 1;
        while (i < total && P[i] === P[0]) i++;
        if (i === total) { mask[t] |= 1 << c; est[t] += 16; continue; }
        est[t] += chooseFilters(P, tw, th, sc.z[t][c], sc.filt[t][c]);
      }

    const t = tries === 2 && est[1] < est[0] ? 1 : 0;
    o.reserve(5);
    o.buf[o.len++] = mask[t] | (t ? SUBGREEN : 0);
    for (let c = 0; c < ch; c++) if (mask[t] & (1 << c)) o.buf[o.len++] = sc.plane[t][c][0];
    for (let c = 0; c < ch; c++)
      if (!(mask[t] & (1 << c))) emitPlane(o, sc.z[t][c], sc.filt[t][c], tw, th);

    if (o.len - start > raw + 1) {
      o.len = start;
      o.reserve(raw + 1);
      o.buf[o.len++] = STORED;
      for (let y = 0; y < th; y++) {
        const s = ((ty + y) * imgW + tx) * ch;
        o.buf.set(px.subarray(s, s + tw * ch), o.len);
        o.len += tw * ch;
      }
    }
  }

  function encodeLevel(px, mw, mh, ch) {
    const tcx = Math.ceil(mw / TILE), tcy = Math.ceil(mh / TILE), tcount = tcx * tcy;
    const o = new Out(tcount * 4 + (mw * mh * ch >> 1));

<script>
const $ = (id) => document.getElementById(id);
const post = (m) => parent.postMessage({ pluginMessage: m }, '*');
const status = (t) => { $('status').textContent = t; };

function tab(name) {
  $('import').hidden = name !== 'import';
  $('export').hidden = name !== 'export';
  $('tab-import').classList.toggle('on', name === 'import');
  $('tab-export').classList.toggle('on', name === 'export');
  status('');
}
$('tab-import').onclick = () => tab('import');
$('tab-export').onclick = () => tab('export');

/* Import: .yapf → pixels → exact PNG → Figma image */
/* Any YAPF file → 8-bit pixels.  8-bit images keep their exact pixels and
 * channels; GPU blocks, 16-bit and float textures are converted for display
 * (RGBA).  Cubes, arrays, volumes and animations give their first image. */
function yapfToPixels(tex) {
  const w = tex.width, h = tex.height;
  if (tex.payload === 0 && tex.sample === 0)
    return { width: w, height: h, channels: tex.channels,
             pixels: tex.surfaces[0].subarray(0, w * h * tex.channels) };
  const v = YAPF.textureToRGBA(tex, 0, 0);
  return { width: w, height: h, channels: 4, pixels: new Uint8Array(v.rgba.buffer),
           note: tex.payload === 1 ? 'GPU blocks decoded' : 'converted to 8-bit' };
}
async function importFiles(files) {
  const images = [];
  for (const f of files) {
    try {
      const img = yapfToPixels(YAPF.decodeTexture(new Uint8Array(await f.arrayBuffer())));
      const png = await PNG.encode(img.pixels, img.width, img.height, img.channels);
      images.push({ name: f.name.replace(/\.yapf$/i, ''), width: img.width, height: img.height, png });
      status('Decoded ' + f.name + ' (' + img.width + '×' + img.height + (img.note ? ', ' + img.note : '') + ')');
    } catch (e) {
      status(f.name + ': ' + e.message);
    }
  }
  if (images.length) post({ type: 'import', images });
}
$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => importFiles([...e.target.files]);
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('hover'); };
$('drop').ondragleave = () => $('drop').classList.remove('hover');
$('drop').ondrop = (e) => { e.preventDefault(); $('drop').classList.remove('hover'); importFiles([...e.dataTransfer.files]); };

/* Export: Figma PNG → exact pixels → .yapf download */
$('go').onclick = () => { status('Exporting…'); post({ type: 'export', scale: +$('scale').value }); };

async function exported(name, pngBytes) {
  let img = await PNG.decode(pngBytes);
  let { pixels, channels } = img;
  if (channels === 4) {                                   // drop alpha when fully opaque
    let opaque = true;
    for (let i = 3; i < pixels.length && opaque; i += 4) opaque = pixels[i] === 255;
    if (opaque) {
      const rgb = new Uint8Array(img.width * img.height * 3);
      for (let i = 0, j = 0; i < pixels.length; i += 4, j += 3) rgb.set(pixels.subarray(i, i + 3), j);
      pixels = rgb; channels = 3;
    }
  }
  const file = YAPF.encode({ width: img.width, height: img.height, channels, pixels,
                             flags: YAPF.FLAG.SRGB,
                             gpuFormat: channels === 4 ? YAPF.GPU.SRGB8_A8 : YAPF.GPU.SRGB8 });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([file], { type: 'image/x-yapf' }));
  a.download = name.replace(/[\\/:*?"<>|]/g, '_') + '.yapf';
  document.body.appendChild(a); a.click(); a.remove();
  status('Saved ' + a.download + '\n' + img.width + '×' + img.height + ', ' +
         (file.length / 1024).toFixed(1) + ' KB (' +
         (100 * file.length / (img.width * img.height * channels)).toFixed(1) + '% of raw)');
}

onmessage = (e) => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'mode') tab(m.mode === 'export' ? 'export' : 'import');
  if (m.type === 'selection')
    $('sel').textContent = m.names.length ? 'Selected: ' + m.names.join(', ') : 'Nothing selected';
  if (m.type === 'exported') exported(m.name, m.png).catch((err) => status(m.name + ': ' + err.message));
};
